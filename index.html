# sL4
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dev & Kalina: Live Multiplayer Date</title>
    <style>
        body { margin: 0; overflow: hidden; background: #0c0513; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; touch-action: none; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; box-sizing: border-box; }
        .interactive { pointer-events: auto; }
        #menu, #hud { background: rgba(12, 5, 19, 0.9); color: #fff; padding: 18px; border-radius: 16px; border: 1px solid rgba(255,105,180,0.4); backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
        #menu { max-width: 380px; margin: auto; text-align: center; }
        input, button { padding: 12px 18px; margin: 6px; border-radius: 8px; border: none; font-size: 16px; outline: none; }
        button { background: linear-gradient(135deg, #ff477e, #ff70a6); color: white; cursor: pointer; font-weight: bold; box-shadow: 0 4px 15px rgba(255,71,126,0.5); }
        input { background: #1c0b2b; color: white; border: 1px solid #5a2c8a; width: 80%; text-align: center; letter-spacing: 2px; }
        
        #touch-controls { display: none; position: absolute; bottom: 30px; left: 30px; width: 140px; height: 140px; pointer-events: auto; }
        .control-btn { position: absolute; width: 45px; height: 45px; background: rgba(255, 71, 126, 0.6); border: 2px solid white; border-radius: 50%; color: white; font-size: 20px; display: flex; align-items: center; justify-content: center; }
        #btn-up { top: 0; left: 47px; }
        #btn-down { bottom: 0; left: 47px; }
        #btn-left { top: 47px; left: 0; }
        #btn-right { top: 47px; right: 0; }

        #kiss-btn { display: none; position: absolute; bottom: 35px; right: 35px; width: 85px; height: 85px; border-radius: 50%; background: linear-gradient(135deg, #ff2060, #ff477e); color: white; font-size: 32px; border: 4px solid white; box-shadow: 0 6px 25px rgba(255,32,96,0.9); cursor: pointer; pointer-events: auto; }
        
        #cutscene-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, rgba(255,105,180,0.9) 0%, rgba(12,5,19,0.98) 100%); display: none; flex-direction: column; justify-content: center; align-items: center; color: white; z-index: 100; backdrop-filter: blur(8px); }
        #cutscene-overlay h1 { font-size: 42px; text-shadow: 0 4px 20px rgba(0,0,0,0.8); margin: 0 0 10px 0; }
        .heart { position: absolute; color: #ff477e; font-size: 26px; animation: floatUp 2s infinite ease-in; }
        @keyframes floatUp { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-160px) scale(1.5); opacity: 0; } }
    </style>
    <!-- Three.js & PeerJS for Free Multiplayer Connection -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
</head>
<body>

    <div id="ui-layer">
        <div id="menu" class="interactive">
            <h2 style="color: #ff70a6; margin-top:0;">Dev & Kalina</h2>
            <p id="connection-status" style="font-size: 13px; color: #d0bfff;">Enter a 4-digit code (e.g. 7777) to connect live.</p>
            <input type="text" id="code-input" placeholder="7777" maxlength="4"><br>
            <button onclick="hostGame()">Host Room (Dev)</button>
            <button onclick="connectGame()">Join Room (Kalina)</button>
        </div>

        <div id="hud" style="display: none;">
            <h3 style="margin: 0 0 5px 0; color: #ff70a6;">Act 1: Live Date</h3>
            <p id="role-display" style="margin: 0; font-size: 12px; color: #d0bfff;">Connected live in real-time!</p>
        </div>

        <div id="touch-controls">
            <div class="control-btn" id="btn-up" ontouchstart="sendMove(0, -0.4)" onmousedown="sendMove(0, -0.4)">⬆️</div>
            <div class="control-btn" id="btn-down" ontouchstart="sendMove(0, 0.4)" onmousedown="sendMove(0, 0.4)">⬇️</div>
            <div class="control-btn" id="btn-left" ontouchstart="sendMove(-0.4, 0)" onmousedown="sendMove(-0.4, 0)">⬅️</div>
            <div class="control-btn" id="btn-right" ontouchstart="sendMove(0.4, 0)" onmousedown="sendMove(0.4, 0)">➡️</div>
        </div>

        <button id="kiss-btn" onclick="sendKiss()">💋</button>
    </div>

    <div id="cutscene-overlay">
        <h1>💕 Dev & Kalina 💕</h1>
        <p style="font-size: 20px; font-style: italic; color: #ffe6f2;">"Connected across the world."</p>
    </div>

    <script>
        let scene, camera, renderer, devGroup, kalinaGroup;
        let peer, conn, isHost = false, myRole = '';

        function initWorld() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0c0513);
            scene.fog = new THREE.FogExp2(0x0c0513, 0.008);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 4, 11);
            camera.lookAt(0, 1, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0x3a2259, 1.4));
            const sunLight = new THREE.DirectionalLight(0xff99bb, 2.0);
            sunLight.position.set(15, 25, 15);
            scene.add(sunLight);

            const floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshStandardMaterial({ color: 0x150b24, roughness: 0.8 }));
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // DEV Model (5'10"[cite: 5], Blue Shirt[cite: 5])
            devGroup = new THREE.Group();
            const devTorso = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.1, 0.35), new THREE.MeshStandardMaterial({ color: 0x1b4965 }));
            devTorso.position.y = 1.1; devGroup.add(devTorso);
            const devHead = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.42, 0.38), new THREE.MeshStandardMaterial({ color: 0xffd1b3 }));
            devHead.position.y = 1.8; devGroup.add(devHead);
            const devHair = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.22, 0.44), new THREE.MeshStandardMaterial({ color: 0x111111 }));
            devHair.position.set(0, 2.05, 0); devGroup.add(devHair);
            devGroup.position.set(-1.5, 0, 0);
            scene.add(devGroup);

            // KALINA Model (5'4"[cite: 6], Petite)
            kalinaGroup = new THREE.Group();
            const kalinaTorso = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.95, 0.3), new THREE.MeshStandardMaterial({ color: 0x2b1b2d }));
            kalinaTorso.position.y = 0.95; kalinaGroup.add(kalinaTorso);
            const kalinaHead = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.38, 0.35), new THREE.MeshStandardMaterial({ color: 0xe6b89c }));
            kalinaHead.position.y = 1.55; kalinaGroup.add(kalinaHead);
            const kalinaHair = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.6, 0.42), new THREE.MeshStandardMaterial({ color: 0x140d08 }));
            kalinaHair.position.set(0, 1.6, -0.05); kalinaGroup.add(kalinaHair);
            kalinaGroup.position.set(1.5, 0, 0);
            scene.add(kalinaGroup);

            animate();
        }

        // Multiplayer Setup via PeerJS (Free P2P Connection)
        function hostGame() {
            const code = document.getElementById('code-input').value;
            if(code.length !== 4) { alert("Enter 4 digits!"); return; }
            isHost = true;
            myRole = 'dev';
            peer = new Peer('dev-kalina-room-' + code);
            
            peer.on('open', () => {
                document.getElementById('connection-status').innerHTML = "Waiting for Kalina to join code " + code + "...";
            });

            peer.on('connection', (incomingConn) => {
                conn = incomingConn;
                setupConnection();
            });
        }

        function connectGame() {
            const code = document.getElementById('code-input').value;
            if(code.length !== 4) { alert("Enter 4 digits!"); return; }
            isHost = false;
            myRole = 'kalina';
            peer = new Peer();

            peer.on('open', () => {
                conn = peer.connect('dev-kalina-room-' + code);
                setupConnection();
            });
        }

        function setupConnection() {
            conn.on('open', () => {
                startGameUI();
            });

            conn.on('data', (data) => {
                if(data.type === 'move') {
                    devGroup.position.x = data.devX;
                    devGroup.position.z = data.devZ;
                    kalinaGroup.position.x = data.kalinaX;
                    kalinaGroup.position.z = data.kalinaZ;
                } else if(data.type === 'kiss') {
                    triggerKissAnimation();
                }
            });
        }

        function startGameUI() {
            document.getElementById('menu').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            document.getElementById('touch-controls').style.display = 'block';
            document.getElementById('kiss-btn').style.display = 'block';
            document.getElementById('role-display').innerHTML = "Playing as: " + (myRole === 'dev' ? 'Dev (5\'10")' : 'Kalina (5\'4")');
            initWorld();
        }

        function sendMove(dx, dz) {
            if(!conn || !conn.open) return;
            
            if(myRole === 'dev') {
                devGroup.position.x += dx;
                devGroup.position.z += dz;
            } else {
                kalinaGroup.position.x += dx;
                kalinaGroup.position.z += dz;
            }

            // Send positions across to her device instantly
            conn.send({
                type: 'move',
                devX: devGroup.position.x,
                devZ: devGroup.position.z,
                kalinaX: kalinaGroup.position.x,
                kalinaZ: kalinaGroup.position.z
            });
        }

        function sendKiss() {
            if(conn && conn.open) {
                conn.send({ type: 'kiss' });
            }
            triggerKissAnimation();
        }

        function triggerKissAnimation() {
            const overlay = document.getElementById('cutscene-overlay');
            overlay.style.display = 'flex';
            devGroup.position.x = -0.3;
            kalinaGroup.position.x = 0.3;

            for(let i=0; i<8; i++) {
                let heart = document.createElement('div');
                heart.className = 'heart';
                heart.innerHTML = '❤️';
                heart.style.left = (42 + Math.random() * 16) + '%';
                heart.style.bottom = '35%';
                overlay.appendChild(heart);
                setTimeout(() => heart.remove(), 2000);
            }

            setTimeout(() => {
                overlay.style.display = 'none';
            }, 2500);
        }

        function animate() {
            requestAnimationFrame(animate);
            if(renderer && scene && camera) renderer.render(scene, camera);
        }
    </script>
</body>
</html>
